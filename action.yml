name: 'Claude PR Reviewer'
description: 'Automated PR review using Claude AI with pr-review-toolkit plugin'
author: 'drillan'

branding:
  icon: 'code'
  color: 'orange'

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token (either this or anthropic_api_key is required)'
    required: false
    default: ''

  anthropic_api_key:
    description: 'Anthropic API key (either this or claude_code_oauth_token is required)'
    required: false
    default: ''

  anthropic_model:
    description: 'Claude model to use (e.g., claude-opus-4-5-20251101, claude-sonnet-4-5-20250514)'
    required: false
    default: 'claude-opus-4-5-20251101'

  anthropic_base_url:
    description: 'Override the Anthropic API base URL to route requests through your own gateway (e.g. https://gateway.example.com). Leave empty to use the default Anthropic endpoint.'
    required: false
    default: ''

  review_language:
    description: 'Language for review comments (e.g., English, Japanese)'
    required: false
    default: 'English'

  custom_prompt:
    description: 'Additional custom instructions for the review'
    required: false
    default: ''

  pr_number:
    description: 'PR number to review (required for workflow_dispatch; auto-detected for pull_request and issue_comment events)'
    required: false
    default: ''

  allowed_tools:
    description: 'Tools allowed for Claude to use'
    required: false
    default: 'Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob'

  claude_args:
    description: 'Additional arguments to pass to Claude Code (e.g. --verbose, --max-turns 10)'
    required: false
    default: ''

  show_full_output:
    description: 'Log Claude Code full JSON output (all messages and tool results) to the Actions log for debugging. WARNING: may expose secrets present in tool output'
    required: false
    default: 'false'

  claude_md_inject:
    description: 'Space-separated list of files to append to CLAUDE.md before the review runs (e.g. ".github/claude-review-instructions.md .github/CODE_REVIEW.md"). Files that do not exist are silently skipped.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Inject files into CLAUDE.md
      shell: bash
      run: |
        for f in ${{ inputs.claude_md_inject }}; do
          [ -f "$f" ] && cat "$f" >> CLAUDE.md
        done

    - name: Run Claude PR Review (OAuth Token)
      if: ${{ inputs.claude_code_oauth_token != '' }}
      uses: anthropics/claude-code-action@v1
      env:
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        plugin_marketplaces: |
          https://github.com/anthropics/claude-code.git
        plugins: |
          pr-review-toolkit@claude-code-plugins
        show_full_output: ${{ inputs.show_full_output }}
        prompt: |
          /pr-review-toolkit:review-pr
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}

          ${{ inputs.custom_prompt }}

          Post review results as a PR comment using `gh pr comment`.
        claude_args: |
          --allowedTools "${{ inputs.allowed_tools }}"
          ${{ inputs.claude_args }}

    - name: Run Claude PR Review (API Key)
      if: ${{ inputs.anthropic_api_key != '' && inputs.claude_code_oauth_token == '' }}
      uses: anthropics/claude-code-action@v1
      env:
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        plugin_marketplaces: |
          https://github.com/anthropics/claude-code.git
        plugins: |
          pr-review-toolkit@claude-code-plugins
        show_full_output: ${{ inputs.show_full_output }}
        prompt: |
          /pr-review-toolkit:review-pr
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}

          ${{ inputs.custom_prompt }}

          Post review results as a PR comment using `gh pr comment`.
        claude_args: |
          --allowedTools "${{ inputs.allowed_tools }}"
          ${{ inputs.claude_args }}
